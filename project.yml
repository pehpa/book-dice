name: BookDice
options:
  bundleIdPrefix: com.pehpa
  deploymentTarget:
    iOS: "17.0"

# Personal/account-specific settings (e.g. DEVELOPMENT_TEAM) live in a local,
# gitignored Local.xcconfig instead of here — see Local.xcconfig.template.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  BookDiceKit:
    path: BookDiceKit

targets:
  BookDice:
    type: application
    platform: iOS
    sources:
      - path: BookDice
    dependencies:
      - package: BookDiceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pehpa.bookdice
        PRODUCT_NAME: book-dice
        INFOPLIST_KEY_CFBundleDisplayName: "Book Dice"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
